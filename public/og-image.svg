<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <rect width="1200" height="630" fill="#0f172a"/>
  <rect x="0" y="0" width="1200" height="630" fill="url(#grid)" opacity="0.05"/>
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="white" stroke-width="0.5"/>
    </pattern>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <text x="600" y="260" font-family="system-ui, sans-serif" font-size="72" font-weight="800" fill="white" text-anchor="middle" dominant-baseline="middle">Gustavo Soto</text>
  <text x="600" y="340" font-family="system-ui, sans-serif" font-size="32" fill="#94a3b8" text-anchor="middle" dominant-baseline="middle">Desarrollador Web · React · TypeScript</text>
  <rect x="480" y="390" width="240" height="4" rx="2" fill="url(#grad)"/>
  <text x="600" y="440" font-family="system-ui, sans-serif" font-size="20" fill="#64748b" text-anchor="middle" dominant-baseline="middle">gustavo-soto-portfolio.vercel.app</text>
</svg>
