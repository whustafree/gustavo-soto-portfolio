<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" fill="none">
  <rect width="800" height="450" fill="#0f172a"/>
  <!-- Hero section -->
  <rect x="0" y="0" width="800" height="300" fill="url(#heroGrad)"/>
  <defs>
    <linearGradient id="heroGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e0a2e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <nav>
    <rect x="40" y="30" width="120" height="20" rx="4" fill="#e11d48"/>
    <rect x="550" y="33" width="60" height="14" rx="4" fill="#334155"/>
    <rect x="620" y="33" width="60" height="14" rx="4" fill="#334155"/>
    <rect x="690" y="33" width="60" height="14" rx="4" fill="#334155"/>
  </nav>
  <!-- Tattoo artist title -->
  <text x="400" y="130" font-family="system-ui, sans-serif" font-size="42" font-weight="800" fill="white" text-anchor="middle">Marijo</text>
  <text x="400" y="170" font-family="system-ui, sans-serif" font-size="42" font-weight="800" fill="white" text-anchor="middle">Tattoo</text>
  <text x="400" y="200" font-family="system-ui, sans-serif" font-size="14" fill="#e11d48" text-anchor="middle">✦ ESTUDIO DE TATUAJES ✦</text>
  <rect x="320" y="225" width="160" height="40" rx="20" fill="#e11d48"/>
  <text x="400" y="250" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle">Ver trabajos</text>
  <!-- Gallery thumbnails -->
  <rect x="40" y="330" width="170" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="230" y="330" width="170" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="420" y="330" width="170" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="610" y="330" width="150" height="100" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="125" y="385" font-family="system-ui, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Galería</text>
  <text x="125" y="400" font-family="system-ui, sans-serif" font-size="10" fill="#475569" text-anchor="middle">de trabajos</text>
  <text x="400" y="440" font-family="system-ui, sans-serif" font-size="11" fill="#475569" text-anchor="middle">Placeholder — Reemplazar con screenshot real</text>
</svg>
